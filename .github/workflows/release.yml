name: Publish HYP Viewer 0.x Releases

# Release uses the exact signed APK and Windows installer from a successful
# main-branch CI run. This workflow never builds, compiles, or signs binaries.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_run:
    workflows: ["Build and verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact successful main-branch CI commit SHA"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: hyp-publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish existing signed CI artifacts
    # One-time repair push for v0.4.22, plus normal future successful CI.
    if: ${{ (github.event_name == 'push' && github.event.before == '9037002c682c0303cd37bce79478e1161853507c') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.source_sha != '') }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha || '9037002c682c0303cd37bce79478e1161853507c' }}
    steps:
      - name: Check out the exact previously built source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Validate 0.x version and find the exact successful CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid source SHA"; exit 1; }
          python3 scripts/check_release_version.py
          TAG="$(tr -d '\r\n' < .github/release-request.txt)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$SOURCE_SHA&event=push&status=success&per_page=30" > ci-runs.json
          CI_RUN="$(jq -r --arg sha "$SOURCE_SHA" '.workflow_runs | map(select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")) | .[0].id // empty' ci-runs.json)"
          if [[ -z "$CI_RUN" ]]; then
            echo "::error::No successful main CI for exact source commit $SOURCE_SHA"
            exit 1
          fi
          echo "run_id=$CI_RUN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Reusing CI run $CI_RUN for $TAG at $SOURCE_SHA"
      - name: Download original CI Windows installer
        uses: actions/download-artifact@v4
        with:
          name: release-windows-${{ env.SOURCE_SHA }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/windows
      - name: Download original CI signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: release-android-${{ env.SOURCE_SHA }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/android
      - name: Verify checksums, build provenance, and APK signing
        env:
          TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/windows/COMMIT_SHA.txt)" = "$SOURCE_SHA"
          test "$(cat dist/android/COMMIT_SHA.txt)" = "$SOURCE_SHA"
          (cd dist/windows && sha256sum -c SHA256SUMS.txt)
          (cd dist/android && sha256sum -c SHA256SUMS.txt)
          test -f "dist/windows/HYP_Viewer_Setup_$TAG.exe"
          test -f "dist/android/HYP_Viewer_$SOURCE_SHA.apk"
          SDK="$(printenv ANDROID_SDK_ROOT || true)"
          if [[ -z "$SDK" ]]; then SDK="$(printenv ANDROID_HOME || true)"; fi
          APK_SIGNER=""
          if [[ -n "$SDK" && -d "$SDK/build-tools" ]]; then
            APK_SIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          fi
          if [[ -z "$APK_SIGNER" ]]; then APK_SIGNER="$(command -v apksigner || true)"; fi
          if [[ -z "$APK_SIGNER" || ! -x "$APK_SIGNER" ]]; then
            echo "::error::apksigner unavailable; refusing unverifiable Android release"
            exit 1
          fi
          "$APK_SIGNER" verify --verbose "dist/android/HYP_Viewer_$SOURCE_SHA.apk"
          mkdir -p public
          cp "dist/windows/HYP_Viewer_Setup_$TAG.exe" public/
          cp "dist/android/HYP_Viewer_$SOURCE_SHA.apk" "public/HYP_Viewer_$TAG.apk"
          (cd public && sha256sum *.apk *.exe > SHA256SUMS.txt)
          printf '%s\n' "$SOURCE_SHA" > public/BUILD_COMMIT.txt
      - name: Publish immutable 0.x release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")"
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Tag points to a different build commit; refusing release"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release already exists; not replacing immutable assets"
            exit 0
          fi
          cat > release-notes.md <<EOF
          # HYP Viewer $TAG

          CI source commit: $SOURCE_SHA

          - Add optional Standard / Strong / Off web-search ad blocking.
          - Fold stopped-download failures, with an explicit retry-all option.
          - Allow new downloads to enter the persistent queue during a transfer.
          - Preserve offline files and backups; retain the 0.x version scheme.
          - Android APK: signed once in main CI using persistent release signing.
          - Windows: installer built once in that same CI run.
          - Release reuses the original artifacts and verifies their checksums.

          Note: Fully independent parallel downloads and per-work cancel/delete
          remain incomplete; device behavior must be tested after release.

          Check SHA256SUMS.txt and BUILD_COMMIT.txt before installation.
          EOF
          if [[ -n "$TAG_SHA" ]]; then
            gh release create "$TAG" public/* --verify-tag --title "HYP Viewer $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" public/* --target "$SOURCE_SHA" --title "HYP Viewer $TAG" --notes-file release-notes.md
          fi
