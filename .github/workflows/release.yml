name: Publish HYP Viewer installers

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: flutter create --platforms=android --org com.sopo9880 --project-name hyp_viewer .
      - run: flutter pub get
      - run: flutter test
      - name: Configure persistent APK signing
        env:
          HYP_ANDROID_KEYSTORE_BASE64: ${{ secrets.HYP_ANDROID_KEYSTORE_BASE64 }}
          HYP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HYP_ANDROID_KEYSTORE_PASSWORD }}
          HYP_ANDROID_KEY_ALIAS: ${{ secrets.HYP_ANDROID_KEY_ALIAS }}
          HYP_ANDROID_KEY_PASSWORD: ${{ secrets.HYP_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare_android_signing.py
      - run: flutter build apk --release
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/HYP_Viewer_$GITHUB_REF_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Windows project
        run: flutter create --platforms=windows --org com.sopo9880 --project-name hyp_viewer .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\hyp_viewer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: installer/Output/HYP_Viewer_Setup_*.exe
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.apk *.exe > SHA256SUMS.txt
      - name: Publish only after both builds succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
