name: Publish HYP Viewer 0.x Releases

# Releases begin only when the reviewed release-request file changes on main.
# A manual re-run on that same commit may later attach a permanently signed APK.
on:
  push:
    branches: [main]
    paths:
      - .github/release-request.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyp-publish-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Enforce 0.x version and check Android signing
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      android_ready: ${{ steps.signing.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the release request and pubspec
        id: version
        run: python3 scripts/check_release_version.py
      - name: Check signing key presence without printing secrets
        id: signing
        env:
          SIGNING_B64: ${{ secrets.HYP_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE: ${{ secrets.HYP_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.HYP_ANDROID_KEY_ALIAS }}
          SIGNING_KEY: ${{ secrets.HYP_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$SIGNING_B64" && -n "$SIGNING_STORE" && -n "$SIGNING_ALIAS" && -n "$SIGNING_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Persistent Android signing is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are missing: only Windows Setup.exe can be published for now."
          fi

  windows:
    name: Build Windows Setup.exe
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows host project
        run: flutter create --platforms=windows --org com.sopo9880 --project-name hyp_viewer .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package Setup.exe
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:RELEASE_VERSION" "installer\hyp_viewer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: installer/Output/HYP_Viewer_Setup_*.exe
          if-no-files-found: error

  android:
    name: Build persistently signed Android APK
    needs: preflight
    if: ${{ needs.preflight.outputs.android_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create --platforms=android --org com.sopo9880 --project-name hyp_viewer .
      - run: flutter pub get
      - run: flutter test
      - name: Configure persistent APK signing
        env:
          HYP_ANDROID_KEYSTORE_BASE64: ${{ secrets.HYP_ANDROID_KEYSTORE_BASE64 }}
          HYP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HYP_ANDROID_KEYSTORE_PASSWORD }}
          HYP_ANDROID_KEY_ALIAS: ${{ secrets.HYP_ANDROID_KEY_ALIAS }}
          HYP_ANDROID_KEY_PASSWORD: ${{ secrets.HYP_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare_android_signing.py
      - run: flutter build apk --release
      - name: Name signed APK
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/HYP_Viewer_$RELEASE_TAG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/HYP_Viewer_*.apk
          if-no-files-found: error

  publish:
    name: Publish or safely complete a v0.x GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, windows, android]
    if: ${{ always() && needs.preflight.result == 'success' && needs.windows.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@v4
        if: ${{ needs.preflight.outputs.android_ready == 'true' }}
        with:
          name: android-release
          path: dist
      - name: Generate checksums and transparent release notes
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          ANDROID_READY: ${{ needs.preflight.outputs.android_ready }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum HYP_Viewer_Setup_*.exe > SHA256SUMS.txt)
          if [[ "$ANDROID_READY" == "true" ]]; then
            (cd dist && sha256sum HYP_Viewer_v*.apk >> SHA256SUMS.txt)
            ANDROID_NOTE="Permanently signed APK included."
          else
            ANDROID_NOTE="Signed APK pending. A persistent Android keystore must be configured before it can be attached. Do not use ephemeral debug APKs for normal updating."
          fi
          cat > release-notes.md <<EOF
          # HYP Viewer $RELEASE_TAG (0.x preview)

          Experimental 0.x update. Install over the previous release to test
          the new functionality; back up your library to JSON first.

          - Windows: Setup.exe included (unsigned publisher; SmartScreen may warn).
          - Android: $ANDROID_NOTE

          Changes in v0.4.3.1:
          - Run approved downloads with Android background notification
            or Windows tray, and recover persisted unfinished pages on restart.
          - Preserve existing CBZ and library records during retries.
          - User force-stop and OS power policies may interrupt downloads;
            resume after reopening the app.

          Changes in v0.4.3:
          - Store verified multilingual title aliases and multiple HTTPS
            discovery URLs per work. Preserve original titles, read positions,
            favorites, completion, local covers and CBZ identifiers.
          - Expand unified and edition-specific search through known translated
            titles, artist, circle, series and tags, showing progress,
            relevance, individual field failures and bounded pagination.
          - Display safe online-to-shelf language-edition associations and
            review metadata with bounded cover-similarity evidence.
            Similar covers alone never authorize an automatic merger.
          - Browse more public YouTube playlist/channel videos on demand;
            report when comment content is incomplete or inaccessible and
            keep accessible public descriptions.
          - Retry only a failed/corrupt reader page without removing valid
            page caches; preserve existing transient-HTTP backoff behavior.
          - Improve Korean/English/Japanese translations across reader
            controls, source editor, work information, and reading reports.
          - Add regression cases for translated title discovery, source URL
            editing/JSON recovery, 1,000-work library search, safe edition
            unlinking, image cache eviction and YouTube continuations.
          - Remote metadata providers and public social-network content may
            be unavailable or incomplete; the application cannot bypass
            authentication requirements.

          Changes in v0.4.1:
          - Safe HTTP-to-HTTPS upgrades for trusted YouTube, Instagram and
            Hitomi links, including native Android community-post shares.
          - Parse full publicly embedded YouTube community post text when
            available; explicitly warn if only a clipped preview was loaded.
          - Public YouTube playlist/channel video-selection support,
            with limited user-selected video/comment analysis.
          - Unified metadata search now fans out across supported title,
            artist, circle and tag fields, and deduplicates fetched IDs.
            Category counts may overlap and are labeled accordingly.
          - Enhanced other-language edition search with alternate titles,
            two-page searches, supporting metadata, optional bounded cover
            similarity, and an explicit last-read edition choice.
          - Translated settings accordion headings and A-L Reading Insights
            into formal Korean/English/Japanese locale bundles, including
            dynamic metrics and report labels.
          - Aligned completed hiding with the original policy: finishing
            any edition hides its logical work from the shelf, while search
            and each edition's own reading progress remain independent.
          - Added an opt-in review of legacy last-page records without
            silently rewriting existing completed flags.
          - Existing v0.4.0 functionality retained:
          - Fixed page-edge tapping to use physical left=previous and
            right=next by default, with the reverse setting mirrored; verified
            keyboard and two-page navigation expectations.
          - Fixed final-page completion detection for pre-rendered webtoon
            pages, added manual complete/uncomplete actions and coherent
            completed hiding in language-edition stacks.
          - Library sorting now applies inside series, with optional
            explicit chapter ordering and edition cover stacks inside series.
          - Added conservative multilingual-edition matching by original
            title, creator/circle and chapter. User-confirmed alternate
            titles may be linked or unlinked without losing each edition's
            independent work ID, reading progress or offline files.
          - Expanded source detection to YouTube videos, live links and
            community posts; Instagram posts/reels/stories, Hitomi URLs,
            and arbitrary HTTPS links. Supported public metadata previews
            never require third-party login; inaccessible or private
            content is handled with an explicit paste-text fallback.
          - Added link-finder Clear, reliable collapse even with candidates,
            native Android URL share support and original source-link retention.
          - Extended live Korean/English/Japanese UI translations, including
            reader settings, reading insights, series and edition dialogs.
          - Startup update prompts can be disabled or snoozed per version
            for seven days; a newer release may prompt immediately, and
            manual update checks always remain available.
          - Existing 0.3 data, CBZ downloads, progress, covers, JSON backups,
            notification behavior and safe signed updates are preserved.
          - Note: public remote searches, Instagram metadata, and community
            posts can be unavailable; a link is always recognisable even
            when its comments cannot be fetched without permission.

          Previous v0.3.0 changes retained:
          - Reader side taps now follow the physical left/right direction
            of the chosen reading mode, including two-page spreads.
          - Auto grouping compares original multilingual titles independently
            of translated subtitles, recognizes trailing sequel numerals,
            and can optionally refresh missing metadata after reporting
            that no suggestions were found. All grouping remains opt-in.
          - App notifications dismiss after five seconds (ten for errors),
            fade out, pause during mouse hover, and keep a manual close.
          - Network handover while downloading installers now resumes
            using SHA-256-checked persistent partials, HTTP Range responses
            and bounded retries. The installer is verified before opening.
            Successful installation is confirmed on next app start from
            the running app version, not from merely showing system setup.
          - Library now uses balanced two-button action rows for sorting,
            selection/Auto grouping, and download/completed visibility.
            The completed hide/show toggle persists without deleting work.
          - Home random covers are clickable and open the displayed work,
            including its saved reading progress. Custom banners stay art.
          - Unified library and online metadata search includes paging,
            language and scope filters, on-device duplicate elimination,
            details and save/read actions. Remote mirror availability varies.
          - Favorites remain preserved under My Reading, which adds A-L
            on-device insights: totals, tag combinations, top works,
            creators, dated reading activity, series completion, summaries,
            unread suggestions, heatmaps, cleanup tools, month/year reports
            with PNG export, and filtering/opt-out/delete controls.
            New reading sessions are time-stamped and included in optional
            JSON library backups. Old undated open counts are not fabricated.
          - YouTube Shorts support remains; Instagram integration excluded.

          Previous v0.2.2 changes retained:
          - Auto grouping now reads each work's title/episode instead of the
            same batch-wide Shorts comment, which previously made different
            episodes all look like "Part 1".
          - The wizard shows suggested groups with individual member covers,
            titles, IDs, review reasons and a heuristic confidence tier.
            Users may expand, exclude works, edit group titles and reorder
            chapters before approving; nothing is silently grouped.
          - Similar series titles can match across different Shorts, even
            without numbered chapters. Existing groups can receive new
            chapters without resetting previous order, history or covers.
          - Reader tap zones were first introduced in v0.2.2; v0.3.0
            corrects their physical left/right behavior to respect the
            selected reading direction. Webtoon retains scrolling and a
            separate center tap to toggle reader controls.
          - Tap navigation defaults to ON for new installations, while
            existing explicit user settings are preserved.
          - Gallery IDs are gathered from all contiguous digit windows on
            each line, while separating explicitly numbered episodes.
            Duplicates are removed and up to 160 candidates are verified in
            bounded batches (up to 3 simultaneous metadata requests).
          - Only when the first pass definitely finds no existing gallery
            may an optional second pass combine adjacent lines in one
            comment. Blank lines separate imported commenters. Network
            outages never masquerade as "no matches".

          Previous v0.2.1 features retained:
          - Published-date sorting and site popularity ranks with daily,
            weekly, monthly and yearly periods; unknown ranks remain unknown.
          - Series displayed as stacked covers in the same grid as singles;
            chapter numbers precede date/ID when suggesting an order.
          - Full-cover fit without cropping the library art or title footer.
          - Space hides/restores the PC viewer chrome; center taps toggle the
            immersive UI on touch screens, while side taps turn pages.
          - Pinch or wheel zoom within a five-fold limit. Webtoon retains
            ordinary wheel scroll and supports Ctrl+wheel zoom.
          - Last-page progress now reaches 100 percent; completed status is
            persisted only after the final image has rendered successfully.
          - Data saver requests smaller site thumbnails, falling back to
            original images when unavailable; other modes favor full quality.
          - Foreground image requests receive priority over background
            prefetch. Nearby pages are decoded ahead of display and reusable
            persistent caches are pruned by age and storage budget.

          Previous v0.2.0 features retained:
          - Consolidated webtoon and regular reader image loading in one
            2-concurrent-request priority queue; 503/429 transient
            errors retry with bounded exponential backoff and cooldown.
            Unloaded webtoon panels reserve space to avoid request floods.
          - Far-page jumps take precedence over full prefetch. Slider
            commits only on drag-end so scrubbing does not fetch 100 pages.
            Vertical pages ALWAYS move down, ignoring horizontal RTL.
          - New installation default preload is -1 (whole work cached to
            temporary disk with bounded concurrent reads). Existing user
            values stay intact. Data saver reduces to 1 request and
            suspends full-preload while enabled.
          - Android Back exits a viewer to its parent; non-Home root
            tabs return Home; a second Back at Home within two seconds
            exits after an explicit snackbar. Selection closes first.
          - Mobile bottom tabs: Favorites / Library / HOME / Downloads /
            Settings. Mobile top-right notifications replaced with Update.
            Menu reduced to Settings / Reading History / Backup Settings.
          - Taller cover cards with completion percentage beside pages.
            Home recent section shows up to four items, is collapsible,
            and no longer mislabels favorites as recommendations.
          - Persistent collapsible settings with backup deep-link.
            Library supports added-date, local read-popularity, title
            and numeric-ID sorting; never invent remote views.
          - Explicit multi-work series grouping (manual and Auto wizard),
            expandable chapters, rename/reorder/ungroup without deleting
            progress; already grouped works never altered by Auto.
          - Work Info displays genuine available remote gallery metadata:
            artist, tags, series, type, language, dates, page count,
            local reading history. Remote view counts show unavailable.
            Simplified work menus remove CBZ/ZIP bind and JSON download
            entries and rename original Shorts to Intro Shorts.
          - Downloads adds library-style selection and read-only export
            to user-chosen folders as individual .cbz ZIP-compatible
            archives; Android folder export uses native SAF.
          - JSON portable backups and existing signed upgrades preserved.
            New optional per-work metadata/series fields migrate safely.

          Known limitations: Automated tests use mocked images and notices;
          actual remote sites, Android devices and Samsung firmware may
          behave differently. The web reader may fail if network or source
          access is restricted. Automatic downloads are not permitted
          without user confirmation of rights. Pause is between pages, not
          a resumable network transfer after restarting the app.
          Downloaded CBZ archives stay local and are not included in JSON.
          Optional PNG cover previews and banner art may be included in
          portable JSON backups within their existing size limits.
          Administrator notices are in-app only, not FCM/system background
          push notifications. Installing an APK can be blocked by Android
          security policies, which cannot be bypassed by HYP Viewer.

          Verify assets using SHA256SUMS.txt. Only download from sources
          you have permission to access and retain.
          EOF
      - name: Publish v0.x only and never replace assets from a different commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The single-ref endpoint returns 404 for a missing tag; piping that error
          # through jq can produce "null", incorrectly treated as an existing SHA.
          # Matching refs returns [] instead. Filter the exact tag name so prefix
          # matches cannot be mistaken for the intended release.
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::The existing tag targets a different commit. Refusing to overwrite."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag exists at a different commit."
              exit 1
            fi
            if [[ -n "$tag_sha" ]]; then
              gh release create "$RELEASE_TAG" dist/* --verify-tag --title "HYP Viewer $RELEASE_TAG" --notes-file release-notes.md
            else
              gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "HYP Viewer $RELEASE_TAG" --notes-file release-notes.md
            fi
          fi
