name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Android host project
        run: flutter create --platforms=android --org com.sopo9880 --project-name hyp_viewer .
      - run: flutter pub get
      - name: Check language packs and new UI strings
        run: python3 scripts/check_l10n.py
      - name: Enforce 0.x release policy
        run: python3 scripts/check_release_version.py
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: HYP-Viewer-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Windows host project
        run: flutter create --platforms=windows --org com.sopo9880 --project-name hyp_viewer .
      - run: flutter pub get
      - name: Check language packs and new UI strings
        run: python scripts/check_l10n.py
      - run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\hyp_viewer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: HYP-Viewer-Windows-installer
          path: installer/Output/HYP_Viewer_Setup_*.exe
          if-no-files-found: error
