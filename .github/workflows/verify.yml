name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Android host project
        run: flutter create --platforms=android --org com.sopo9880 --project-name hyp_viewer .
      - name: Apply approved Android launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/apply_app_icons.py --platform android
          python3 -m unittest discover -s scripts -p test_apply_app_icons.py
      - name: Configure Japanese/Korean offline OCR models
        run: python3 scripts/configure_android_ocr.py
      - name: Stage pinned MIT ByeDPI native engine for Android
        run: python3 scripts/prepare_android_byedpi.py
      - name: Verify and package Android DPI host blacklist
        run: python3 scripts/prepare_android_dpi_blacklist.py
      - name: Install pinned Android NDK for VPN bridge
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root missing}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "$manager" || ! -x "$manager" ]]; then
            echo "::error::Android SDK cmdline-tools/sdkmanager unavailable"
            exit 1
          fi
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --install "ndk;27.2.12479018"
          set -o pipefail
          test -x "$sdk/ndk/27.2.12479018/ndk-build"
      - name: Build pinned MIT tun2socks JNI for device VPN
        run: python3 scripts/prepare_android_vpn_tunnel.py
      - name: Configure Android NDK ByeDPI and WebView proxy
        run: python3 scripts/configure_android_dpi.py
      - name: Validate Android DPI engine sources and Gradle wiring
        run: python3 -m unittest discover -s scripts -p test_android_dpi_prepare.py
      - name: Validate staged Android VPN native libraries and JNI
        run: python3 -m unittest discover -s scripts -p test_android_vpn_build.py
      - run: flutter pub get
      - name: Patch WebView Android ProGuard compatibility
        run: python3 scripts/patch_webview_proguard.py
      - name: Generate typed app localizations
        run: flutter gen-l10n
      - name: Check language packs and new UI strings
        run: python3 scripts/check_l10n.py
      - name: Enforce 0.x release policy
        run: python3 scripts/check_release_version.py
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - name: Configure official Android release signing on trusted main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HYP_ANDROID_KEYSTORE_BASE64: ${{ secrets.HYP_ANDROID_KEYSTORE_BASE64 }}
          HYP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HYP_ANDROID_KEYSTORE_PASSWORD }}
          HYP_ANDROID_KEY_ALIAS: ${{ secrets.HYP_ANDROID_KEY_ALIAS }}
          HYP_ANDROID_KEY_PASSWORD: ${{ secrets.HYP_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare_android_signing.py
      - name: Build Android release APK once
        run: flutter build apk --release
      - name: Stage signed Android APK with source proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/HYP_Viewer_${{ github.sha }}.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' '${{ github.sha }}' > dist/COMMIT_SHA.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-android-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HYP-Viewer-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Windows host project
        run: flutter create --platforms=windows --org com.sopo9880 --project-name hyp_viewer .
      - name: Apply approved Windows launcher, tray and installer icons
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply_app_icons.py --platform windows
          python -m unittest discover -s scripts -p test_apply_app_icons.py
      - name: Prevent duplicate Windows app processes
        run: python scripts/patch_windows_single_instance.py
      - name: Install WebView2 NuGet CLI
        shell: pwsh
        run: choco install nuget.commandline -y --no-progress
      - run: flutter pub get
      - name: Generate typed app localizations
        run: flutter gen-l10n
      - name: Check language packs and new UI strings
        run: python scripts/check_l10n.py
      - run: flutter build windows --release
      - name: Validate GoodbyeDPI supervisor syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/windows_dpi_supervisor.ps1',
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Smoke-test Windows DPI supervisor path and startup acknowledgment
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test_windows_dpi_supervisor.ps1
      - name: Bundle verified official GoodbyeDPI for Windows
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_prepare_goodbyedpi.py
          python scripts/prepare_goodbyedpi.py --destination build/windows/x64/runner/Release/tools
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\hyp_viewer.iss"
      - name: Stage Windows installer with source proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item installer/Output/HYP_Viewer_Setup_*.exe dist/
          '${{ github.sha }}' | Set-Content -NoNewline dist/COMMIT_SHA.txt
          Get-ChildItem dist/*.exe | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HYP-Viewer-Windows-installer
          path: installer/Output/HYP_Viewer_Setup_*.exe
          if-no-files-found: error
