name: hyp_viewer
description: HYP Viewer Android and Windows starter
publish_to: none
version: 0.4.13+32
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  scrollable_positioned_list: ^0.3.8
  path_provider: ^2.1.5
  file_picker: ^10.3.2
  excel_community: ^2.5.2
  http: ^1.3.0
  html: ^0.15.7
  flutter_inappwebview: ^6.1.5
  google_mlkit_text_recognition: ^0.17.1
  platform_ocr: ^1.0.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  archive: ^4.5.2
  crypto: ^3.0.7
  open_filex: ^4.7.0
  flutter_background: ^1.3.1
  local_notifier: ^0.1.6
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/hyp_tray.ico
